  const KEY = "blueclub-erp-gate";
  const bytes = (text) => Uint8Array.from(atob(text), (c) => c.charCodeAt(0));
  // 풀린 HTML을 해석해 지금 문서에 옮겨 넣는다. 해석기로 만든 스크립트는 실행되지 않으므로 같은 속성으로 새로 만들어 순서대로 붙인다.
  // document.write로 통째로 바꾸면 React가 화면을 다시 그리며 hydration 경고(#418)를 남겨서 이 방식을 쓴다.
  const show = (html) => {
    const next = new DOMParser().parseFromString(html, "text/html");
    // DOMParser reads <noscript> as if scripts were off, so its JS-off styles would become live (and hide every
    // control that needs JS). Put its content back as plain text, as a page with scripts on reads it.
    for (const node of Array.from(next.querySelectorAll("noscript"))) node.textContent = node.innerHTML;
    const root = document.documentElement;
    for (const attribute of Array.from(root.attributes)) root.removeAttribute(attribute.name);
    for (const attribute of Array.from(next.documentElement.attributes)) root.setAttribute(attribute.name, attribute.value);
    const scripts = Array.from(next.querySelectorAll("script"));
    const marks = scripts.map((script) => { const mark = next.createComment("script"); script.replaceWith(mark); return mark; });
    document.head.replaceWith(document.adoptNode(next.head));
    document.body.replaceWith(document.adoptNode(next.body));
    marks.forEach((mark, index) => {
      const old = scripts[index];
      const fresh = document.createElement("script");
      for (const attribute of Array.from(old.attributes)) fresh.setAttribute(attribute.name, attribute.value);
      if (old.src && !old.hasAttribute("async")) fresh.async = false;
      fresh.text = old.text;
      mark.replaceWith(fresh);
    });
  };
  const decrypt = (key) => crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(IV) }, key, bytes(DATA)).then((plain) => new TextDecoder().decode(plain));
  const remember = (raw) => { try { localStorage.setItem(KEY, raw); } catch (_) {} };
  const recall = () => { try { return localStorage.getItem(KEY); } catch (_) { return null; } };
  // 한 번 연 브라우저는 키를 기억해 두고 다음부터 바로 연다.
  const saved = recall();
  if (saved) {
    crypto.subtle.importKey("raw", bytes(saved), "AES-GCM", false, ["decrypt"]).then(decrypt).then(show).catch(() => { try { localStorage.removeItem(KEY); } catch (_) {} });
  }
  const form = document.getElementById("gate");
  const input = document.getElementById("password");
  const button = document.getElementById("open");
  const error = document.getElementById("error");
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    if (!input.value) { error.textContent = "비밀번호를 넣어 주세요."; return; }
    button.disabled = true;
    error.textContent = "";
    try {
      const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(input.value), "PBKDF2", false, ["deriveKey"]);
      const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes(SALT), iterations: 250000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
      const html = await decrypt(key);
      const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
      remember(btoa(String.fromCharCode(...raw)));
      show(html);
    } catch (_) {
      error.textContent = "비밀번호가 맞지 않아요.";
      button.disabled = false;
      input.select();
    }
  });
})();
